 const bar=`<div class="card" style="margin-bottom:12px"><div class="grid g3"><label class="f" style="margin:0">Placa<input class="in mono" data-act-change="fVf" data-k="placa" value="${esc(f.placa)}" placeholder="Ex.: BEX2A41" maxlength="7" style="text-transform:uppercase"></label><label class="f" style="margin:0">Tipo<select class="in" data-act-change="fVf" data-k="tipo"><option value="">Todos</option>${Object.entries(TIPO).map(([k,v])=>`<option value="${k}" ${f.tipo===k?'selected':''}>${v}</option>`).join('')}</select></label><label class="f" style="margin:0">Status<select class="in" data-act-change="fVf" data-k="st"><option value="">Todos</option><option value="g" ${f.st==='g'?'selected':''}>Verde — apto</option><option value="y" ${f.st==='y'?'selected':''}>Amarelo — atenção</option><option value="r" ${f.st==='r'?'selected':''}>Vermelho — bloqueado</option></select></label></div></div>${busca('Modelo, secretaria, responsável…')}`;
 h=h.replace('<div class="tbl-wrap">',bar+'<div class="tbl-wrap">').replace('<tbody>','<tbody data-sf>');
 const esconder=S.vehicles.filter(v=>(f.placa&&!v.placa.includes(f.placa.toUpperCase().replace(/[^A-Z0-9]/g,'')))||(f.tipo&&v.tipo!==f.tipo)||(f.st&&v.status!==f.st)).map(v=>v.placa);
 esconder.forEach(p=>{h=h.replace(`<tr><td class="mono"><b>${p}</b>`,`<tr style="display:none" data-oculto><td class="mono"><b>${p}</b>`)});return h};

/* ========== GESTOR: SOLICITAÇÕES DE VIAGEM ========== */
PAGES.solicitacoes=u=>{const f=F.sf||(F.sf={dia:'',dest:'',st:'aguardando'});
 const l=S.solic.filter(s=>(f.dia===''||s.dia===+f.dia)&&(!f.dest||s.dest===f.dest)&&(!f.st||s.st===f.st)).sort((a,b)=>a.dia-b.dia);
 const cnt=k=>S.solic.filter(s=>s.st===k).length;
 return head('Solicitações de viagem','Pedidos feitos pelos pacientes. Aprove, recuse ou sugira outra data.',`<a class="btn sec" href="#/lotacao">${ic('car')} Ver lotação</a>`)+
 `<div class="chips">${[['aguardando','Aguardando'],['sugerida','Data sugerida'],['aprovada','Aprovadas'],['recusada','Recusadas'],['','Todas']].map(c=>`<button class="chip ${f.st===c[0]?'on':''}" data-act="sfSt" data-s="${c[0]}">${c[1]}${c[0]?' ('+cnt(c[0])+')':''}</button>`).join('')}</div>
 <div class="grid g2" style="margin-bottom:12px"><label class="f" style="margin:0">Data<select class="in" data-act-change="fSf" data-k="dia"><option value="">Todas</option>${DIAS.map((d,i)=>`<option value="${i}" ${f.dia!==''&&+f.dia===i?'selected':''}>${d}</option>`).join('')}</select></label><label class="f" style="margin:0">Destino<select class="in" data-act-change="fSf" data-k="dest"><option value="">Todos</option>${Object.keys(DEST).map(d=>`<option ${f.dest===d?'selected':''}>${d}</option>`).join('')}</select></label></div>
 ${busca('Nome do paciente, hospital…')}
 <div class="stack" data-sf>${l.map(s=>{const st=SST[s.st];return `<div class="card lbar ${st[1]}"><div class="row between"><b>${esc(s.nome)}</b><span class="pill st-${st[1]}">${st[0]}</span></div>
 <p><b>${s.dest}</b> — ${esc(s.local)} · <b>${DIAS[s.dia]}</b> · consulta ${s.hora}</p><p class="muted" style="font-size:.86rem">${pessoas(s)} pessoa(s) · ${s.idaVolta?'ida e volta':'só ida'}${s.restr.length?' · não usa: '+s.restr.map(r=>RESTR.find(x=>x[0]===r)[1].split(' (')[0]).join(', '):''} · pedido ${s.id} em ${s.quando}${s.pref?' · pediu vaga na viagem de '+T(s.pref).ini:''}</p>
 ${s.st==='aprovada'&&s.trip?`<p style="font-size:.86rem">Viagem ${V(T(s.trip).vei).placa} · embarque ${s.horaIda} em ${esc(s.emb.split(' —')[0])}</p>`:''}
 ${s.st==='aguardando'?`<div class="row" style="margin-top:8px"><button class="btn sm ok" data-act="aprovarSol" data-id="${s.id}">${ic('check','s')} Aprovar</button><button class="btn sm sec" data-act="sugerirData" data-id="${s.id}">Sugerir outra data</button><button class="btn sm ghost" data-act="recusarSol" data-id="${s.id}" style="color:var(--r)">Recusar</button></div>`:''}</div>`}).join('')||'<div class="card empty">Nenhuma solicitação com estes filtros.</div>'}</div>`};

/* ========== GESTOR: LOTAÇÃO E AGRUPAMENTO ========== */
function grupos(){const g={};S.trips.filter(t=>t.dest!=='Campo Mourão'&&!['recusada','concluida','andamento'].includes(t.st)&&t.vei).forEach(t=>{const k=t.dest+'|'+t.dia;(g[k]=g[k]||{dest:t.dest,dia:t.dia,trips:[],sols:[]}).trips.push(t)});
 S.solic.filter(s=>s.st==='aguardando').forEach(s=>{const k=s.dest+'|'+s.dia;(g[k]=g[k]||{dest:s.dest,dia:s.dia,trips:[],sols:[]}).sols.push(s)});
 return Object.values(g).map(x=>{const pes=x.trips.reduce((a,t)=>a+t.pax,0)+x.sols.reduce((a,s)=>a+pessoas(s),0);
  const restr=[...new Set(x.sols.concat(S.solic.filter(s=>s.st==='aprovada'&&x.trips.some(t=>t.id===s.trip))).flatMap(s=>s.restr))];
  const ini=x.trips.length?x.trips.map(t=>t.ini).sort()[0]:hmAdd(x.sols.map(s=>s.hora).sort()[0],-viagemMin(x.dest)-40);const fim=x.trips.length?x.trips.map(t=>t.fim).sort().pop():hmAdd(ini,viagemMin(x.dest)*2+300);
  const cands=S.vehicles.filter(v=>compat(v,restr)&&capV(v)>=pes&&(x.trips.some(t=>t.vei===v.id)||dispVeic(v,x.dia,ini,fim))).sort((a,b)=>capV(a)-capV(b));
  const vazios=x.trips.filter(t=>t.pax/capV(V(t.vei))<.6);const sug=x.trips.length>=2?cands[0]:(cands.find(v=>x.trips.some(t=>t.vei===v.id))||cands[0]);
  return{...x,pes,restr,ini,fim,cands,sug,vazios,encaixe:x.trips.length===1&&sug&&x.trips[0].vei===sug.id}}).sort((a,b)=>a.dia-b.dia)}
PAGES.lotacao=u=>{const gs=grupos().filter(g=>!F.lq||g.dest===F.lq);
 return head('Lotação e agrupamento','Para cada destino e dia: veículos, capacidade e pessoas alocadas. O sistema sugere juntar passageiros.')+
 `<div class="grid g2" style="margin-bottom:4px"><label class="f">Destino<select class="in" data-act-change="fLq"><option value="">Todos</option>${Object.keys(DEST).filter(d=>d!=='Campo Mourão').map(d=>`<option ${F.lq===d?'selected':''}>${d}</option>`).join('')}</select></label>${busca('Destino, data, placa…')}</div>
 <div class="stack" data-sf>${gs.map(g=>{const n=g.trips.length;const precisaAgrupar=n>=2||(n===1&&g.sols.length)||(n===0&&g.sols.length);const sugTxt=g.sug?`${g.pes} ${g.pes===1?'pessoa':'pessoas'} para ${g.dest} em ${DIAS[g.dia].slice(4)}: usar 1 ${TIPO[g.sug.tipo].toLowerCase()} de ${capV(g.sug)} lugares (${g.sug.placa})${n>=2?` em vez de ${n} ${[...new Set(g.trips.map(t=>TIPO[V(t.vei).tipo].toLowerCase()+(n>1?'s':'')))].join(' e ')}`:''}.`:'';
 return `<div class="card"><div class="row between"><h2>${g.dest} · ${DIAS[g.dia]}</h2><span class="pill nodot st-n">${g.pes} pessoa(s)</span></div>
 ${g.vazios.length>=2?`<div class="acard y" style="margin:10px 0"><b>${ic('alert','s')} ${g.vazios.length} veículos sairão parcialmente vazios para ${g.dest} no mesmo dia.</b></div>`:''}
 <div class="grid g2" style="margin-top:10px">${g.trips.map(t=>{const v=V(t.vei);const pct=Math.min(100,t.pax/capV(v)*100);return `<div class="lot"><div class="row between"><b class="mono">${v.placa}</b><span>${TIPO[v.tipo]} · ${t.ini}</span></div><div class="bar ${pct<60?'y':'g'}" style="margin:6px 0"><i style="width:${pct}%"></i></div><small>${t.pax} de ${capV(v)} lugares ocupados${t.mot?' · '+esc(D(t.mot).nome.split(' ')[0]):''}</small></div>`}).join('')}
 ${g.sols.length?`<div class="lot" style="border-style:dashed"><b>${g.sols.length} pedido(s) aguardando</b><br><small>${g.sols.map(s=>esc(s.nome.split(' ')[0])+' ('+pessoas(s)+')').join(', ')}</small></div>`:''}</div>
 ${g.restr.length?`<p class="muted" style="font-size:.84rem;margin-top:8px">Restrições respeitadas: não usar ${g.restr.map(r=>RESTR.find(x=>x[0]===r)[1].split(' (')[0].toLowerCase()).join(', ')}.</p>`:''}
 ${precisaAgrupar?(g.sug?`<div class="notice" style="margin-top:10px;background:var(--g-l);border-color:transparent">${ic('leaf')}<div><b>Sugestão:</b> ${g.encaixe?`encaixar ${g.sols.length} pedido(s) na viagem já programada (${g.sug.placa}): ficam ${g.pes} de ${capV(g.sug)} lugares ocupados.`:sugTxt}</div></div><button class="btn" style="margin-top:10px" data-act="agrupar" data-k="${g.dest}|${g.dia}">Confirmar agrupamento</button>`:`<div class="acard r" style="margin-top:10px">Nenhum veículo livre comporta ${g.pes} pessoas com as restrições informadas. Considere dividir em duas viagens.</div>`):`<p class="muted" style="font-size:.84rem;margin-top:8px">Lotação adequada. Nada a agrupar.</p>`}</div>`}).join('')||'<div class="card empty">Nenhuma viagem ou pedido para agrupar.</div>'}</div>`};

/* ========== ESCALA: próximos 30 dias ========== */
const _esc=PAGES.escala;PAGES.escala=u=>{const h=_esc(u);const ts=S.trips.filter(t=>t.dia>=0&&t.dia<30&&!['recusada','concluida'].includes(t.st)).sort((a,b)=>a.dia-b.dia||toMin(a.ini)-toMin(b.ini));
 const sec=`<div class="card" style="margin-bottom:14px"><div class="row between"><h2>${ic('cal')} Próximos 30 dias</h2><a class="btn sm sec" href="#/calendario">Abrir calendário</a></div>${ts.length?`<div class="prox" data-sf>${ts.map(t=>`<div class="list-item"><div class="mono" style="width:86px;flex:none;font-weight:700">${DIAS[t.dia]}<br><small>${t.ini}–${t.fim}</small></div><div style="flex:1;min-width:0"><b>${t.dest}</b> · ${esc(t.local)}<br><small>${t.mot?esc(D(t.mot).nome):'Sem motorista'} · ${t.vei?V(t.vei).placa:'sem veículo'} · ${t.pax} pass.</small></div></div>`).join('')}</div><p class="muted" style="font-size:.8rem;margin-top:6px">Rotas recorrentes não aparecem aqui: veja em Rotas recorrentes.</p>`:'<div class="empty">Nenhum agendamento marcado para os próximos 30 dias.</div>'}</div>`;
 const i=h.indexOf('<div class="chips">');return h.slice(0,i)+busca('Destino, motorista, placa…')+sec+h.slice(i)};
/* ========== CALENDÁRIO DA FROTA ========== */
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const MESN={Jan:1,Fev:2,Mar:3,Abr:4,Mai:5,Jun:6,Jul:7,Ago:8,Set:9,Out:10,Nov:11,Dez:12};
function eventosDia(iso){const [y,m,d]=iso.split('-').map(Number);const wd=new Date(y,m-1,d).getDay();const r={viagens:[],manut:[],alertas:[],saidas:[],rec:[]};
 const di=DATAS.indexOf(iso);
 if(di>=0)S.trips.filter(t=>t.dia===di&&t.st!=='recusada').forEach(t=>r.viagens.push({h:t.ini+'–'+t.fim,t:t.dest+' — '+t.local,mot:t.mot,vei:t.vei,s:t.st}));
 S.hist.concat(S.histAnt||[]).filter(h=>isoBR(h.data)===iso).forEach(h=>r.viagens.push({h:'—',t:h.dest+' · '+num(h.km)+' km',mot:h.mot,vei:h.vei,s:'concluida'}));
 S.os.filter(o=>isoBR(o.abertura)===iso).forEach(o=>r.manut.push({t:o.id+' · '+o.desc,vei:o.vei,s:ETAPAS[o.etapa]}));
 (S.manutAnt||[]).filter(x=>isoBR(x.data)===iso).forEach(x=>r.manut.push({t:x.serv+' · '+W(x.of).nome,vei:x.vei,s:'Paga'}));
 S.gastos.forEach(g=>{if(y===2026&&m===MESN[g.mes]&&d===15)r.manut.push({t:g.serv+' · '+W(g.of).nome,vei:g.vei,s:'Paga'})});
 S.central.filter(c=>DATAS[c.dia]===iso).forEach(c=>r.manut.push({t:c.tipo+' '+c.hora+' · '+c.onde,vei:c.vei,s:'Agendada'}));
 S.alerts.filter(a=>/^\d\d\/\d\d/.test(a.quando)&&isoBR(a.quando.slice(0,5))===iso).forEach(a=>r.alertas.push({t:a.tipo+' — '+a.txt,vei:a.vei,n:a.st==='aberto'?a.nivel:'res'}));
 S.saidas.filter(s=>isoBR(s.q.slice(0,5))===iso).forEach(s=>r.saidas.push(s));
 if(wd>0&&wd<6&&iso>='2026-02-03')S.rotas.filter(x=>x.ativa&&x.dias.includes(wd-1)&&iso>=isoBR(x.desde)).forEach(x=>r.rec.push({h:x.ini+'–'+x.fim,t:x.nome,mot:x.mot,vei:x.vei}));
 return r}
PAGES.calendario=u=>{const c=F.cal||(F.cal={y:2026,m:9,d:5,modo:'mes'});const iso=`${c.y}-${String(c.m+1).padStart(2,'0')}-${String(c.d).padStart(2,'0')}`;const nd=new Date(c.y,c.m+1,0).getDate();
 const filtros=`<div class="card" style="margin-bottom:12px"><div class="row" style="align-items:flex-end"><div class="tabs" style="margin:0;min-width:220px"><button class="${c.modo==='mes'?'on':''}" data-act="calModo" data-m="mes">Mês</button><button class="${c.modo==='dia'?'on':''}" data-act="calModo" data-m="dia">Dia</button></div>
 <label class="f" style="margin:0">Dia<select class="in" data-act-change="fCal" data-k="d">${Array.from({length:nd},(_,i)=>`<option ${c.d===i+1?'selected':''}>${i+1}</option>`).join('')}</select></label>
 <label class="f" style="margin:0">Mês<select class="in" data-act-change="fCal" data-k="m">${MESES.map((x,i)=>`<option value="${i}" ${c.m===i?'selected':''}>${x}</option>`).join('')}</select></label>
 <label class="f" style="margin:0">Ano<select class="in" data-act-change="fCal" data-k="y">${[2023,2024,2025,2026,2027,2028].map(y=>`<option ${c.y===y?'selected':''}>${y}</option>`).join('')}</select></label>
 <button class="btn sm sec" data-act="calNav" data-n="-1" aria-label="Anterior">◀</button><button class="btn sm sec" data-act="calNav" data-n="1" aria-label="Próximo">▶</button><button class="btn sm ghost" data-act="calHoje">Hoje</button></div></div>`;
 if(c.modo==='mes'){const first=(new Date(c.y,c.m,1).getDay()+6)%7;let cells='';for(let i=0;i<first;i++)cells+='<div class="cal-c vazio"></div>';
  for(let d=1;d<=nd;d++){const di=`${c.y}-${String(c.m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;const e=eventosDia(di);const tot=e.viagens.length+e.manut.length+e.alertas.length+e.rec.length;
   cells+=`<button class="cal-c ${di==='2026-10-05'?'hoje':''} ${d===c.d?'sel':''}" data-act="calDia" data-d="${d}" aria-label="${d} de ${MESES[c.m]}: ${tot} registro(s)"><span class="cal-n">${d}</span>${e.viagens.length?`<span class="cb v">${e.viagens.length} viag.</span>`:''}${e.rec.length?`<span class="cb r">${e.rec.length} rota</span>`:''}${e.manut.length?`<span class="cb m">${e.manut.length} manut.</span>`:''}${e.alertas.length?`<span class="cb a">${e.alertas.length} alerta</span>`:''}</button>`}
  return head('Calendário da frota','O que aconteceu e o que está marcado, em qualquer dia de qualquer ano. Toque em um dia para ver os detalhes.')+filtros+
  `<div class="card"><h2 style="margin-bottom:10px">${MESES[c.m]} de ${c.y}</h2><div class="cal-g">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div class="cal-h">${x}</div>`).join('')}${cells}</div>
  <p class="muted" style="font-size:.8rem;margin-top:10px"><span class="cb v">viagens</span> <span class="cb r">rotas recorrentes</span> <span class="cb m">manutenções</span> <span class="cb a">alertas</span></p></div>`}
 const e=eventosDia(iso);const quem={};e.viagens.concat(e.rec).forEach(x=>{if(x.vei&&x.mot)(quem[x.vei]=quem[x.vei]||new Set()).add(x.mot)});
 const sec=(t,arr,fn)=>`<div class="card"><h2 style="margin-bottom:6px">${t} (${arr.length})</h2>${arr.length?`<div data-sf>${arr.map(fn).join('')}</div>`:'<p class="muted">Nada registrado.</p>'}</div>`;
 return head(`${c.d} de ${MESES[c.m]} de ${c.y}`,'Viagens, manutenções, alertas e quem dirigiu cada veículo neste dia.')+filtros+busca('Placa, motorista, destino…')+
 `<div class="grid g2">${sec('Viagens',e.viagens.concat(e.rec.map(x=>({...x,t:'Rota recorrente: '+x.t}))),x=>`<div class="list-item"><b class="mono" style="width:96px;flex:none">${x.h}</b><div>${esc(x.t)}<br><small>${x.mot?esc(D(x.mot).nome):'—'} · ${x.vei?V(x.vei).placa:'—'}</small></div></div>`)}
 ${sec('Manutenções',e.manut,x=>`<div class="list-item"><div style="flex:1">${esc(x.t)}<br><small class="mono">${V(x.vei).placa}</small></div><span class="pill nodot st-n">${x.s}</span></div>`)}
 ${sec('Alertas',e.alertas,x=>`<div class="list-item"><span class="lvbadge lvb-${x.n}">${LV[x.n][0]}</span><div style="flex:1">${esc(x.t)}<br><small class="mono">${V(x.vei).placa}</small></div></div>`)}
 ${sec('Quem dirigiu cada veículo',Object.entries(quem),([v,ms])=>`<div class="list-item"><b class="mono" style="width:96px;flex:none">${V(v).placa}</b><div>${[...ms].map(m=>esc(D(m).nome)).join(', ')}</div></div>`)}
 ${e.saidas.length?sec('Saídas da garagem',e.saidas,s=>`<div class="list-item"><b class="mono" style="width:96px;flex:none">${s.q.slice(6)}</b><div>${V(s.vei).placa} · ${s.met}<br><small>${s.res==='ok'?'Autorizada':'Sem autorização'}</small></div></div>`):''}</div>`};

/* ========== MANUTENÇÕES REALIZADAS (gestor) ========== */
function listaManut(){const L=[];
 S.os.forEach(o=>{const f=osFaltas(o);L.push({id:o.id,vei:o.vei,serv:o.desc,tipo:o.tipo,of:o.escolhido||o.ofs[0],data:o.abertura,km:(o.ev||{}).km||null,v:osTotal(o)||(o.orc[0]?qTotal(o.orc[0]):0),st:ETAPAS[o.etapa],ev:6-f.length,orig:o.escolhido==='w6'?'PRIME':'Gestor'})});
 S.gastos.forEach((g,i)=>L.push({id:'H-'+(i+1),vei:g.vei,serv:g.serv,tipo:g.tipo,of:g.of,data:'15/'+String(MESN[g.mes]).padStart(2,'0')+'/2026',km:null,v:g.v,st:'Paga',ev:6,orig:'Histórico'}));
 (S.manutAnt||[]).forEach((g,i)=>L.push({id:'A-'+(i+1),vei:g.vei,serv:g.serv,tipo:g.tipo,of:g.of,data:g.data,km:g.km,v:g.v,st:'Paga',ev:6,orig:'Histórico'}));
 S.prime.lanc.filter(l=>l.tipo!=='Abastecimento').forEach(l=>L.push({id:l.id,vei:l.vei,serv:l.tipo+(l.desc?': '+l.desc:''),tipo:'prime',of:'w6',data:l.data+'/2026',km:l.km,v:l.valor,st:'Paga',ev:l.foto?6:5,orig:'PRIME'}));
 return L.sort((a,b)=>isoBR(b.data).localeCompare(isoBR(a.data)))}
PAGES.manutencoes=u=>{const f=F.mf||(F.mf={vei:'',placa:'',of:'',tipo:'',st:'',de:'2025-01-01',ate:'2026-12-31'});
 const L=listaManut().filter(m=>(!f.vei||m.vei===f.vei)&&(!f.placa||V(m.vei).placa.includes(f.placa.toUpperCase()))&&(!f.of||m.of===f.of)&&(!f.tipo||m.tipo===f.tipo)&&(!f.st||m.st===f.st)&&isoBR(m.data)>=f.de&&isoBR(m.data)<=f.ate);
 F.mlist=L;const tot=L.reduce((a,m)=>a+m.v,0);

document.addEventListener('change',e=>{const f=e.target.closest('#fPed');if(!f)return;const fd=new FormData(f);Object.assign(F.ped,{dest:fd.get('dest'),local:fd.get('local'),dia:+fd.get('dia'),hora:fd.get('hora'),acomp:fd.get('acomp')==='1',idaVolta:fd.get('iv')==='1',restr:fd.getAll('restr')});render()});
document.addEventListener('submit',e=>{if(e.target.id!=='fPed')return;const p=F.ped;const u=me();const er=$('#pederr');if(!p.local.trim())return er.textContent='Informe o local da consulta.';
 const s={id:'SV-'+(108+S.solic.length),cpf:u.cpf,ref:u.ref,nome:u.nome,dest:p.dest,local:p.local.trim(),dia:+p.dia,hora:p.hora,acomp:p.acomp,idaVolta:p.idaVolta,restr:p.restr.slice(),st:'aguardando',quando:'05/10'};S.solic.push(s);u.restr=p.restr.slice();
 notify('gestor',`Nova solicitação de viagem: ${u.nome} — ${s.dest} ${DIAS[s.dia]} (consulta ${s.hora}).`,'viagem');audit(`Paciente solicitou viagem ${s.id}: ${s.dest} ${DIAS[s.dia]} ${s.hora}`,s.id);F.ped=null;toast('Solicitação enviada. Você será avisado.');go('minhas')});
/* integração: atalho para anexos pendentes da PRIME */
const _int=PAGES.integracao;PAGES.integracao=u=>{const h=_int(u);const pend=S.os.filter(o=>o.escolhido==='w6'&&o.etapa>=3&&o.etapa<5&&osFaltas(o).length);if(!pend.length||u.perfil==='admin')return h;const i=h.indexOf('<div class="grid g4"');
 return h.slice(0,i)+`<div class="acard y" style="margin-bottom:12px"><h3>${ic('doc')} Ordens de serviço da PRIME com anexos pendentes</h3>${pend.map(o=>`<div class="row between" style="margin-top:6px"><span><b>${o.id}</b> · ${V(o.vei).placa} · falta: ${osFaltas(o).join(', ')}</span>${u.perfil==='gestor'?`<button class="btn sm" data-act="importarPrime" data-id="${o.id}">Buscar anexos</button>`:''}</div>`).join('')}</div>`+h.slice(i)};

/* ========== INÍCIO ========== */
document.documentElement.dataset.theme='light';
load();checkOrdens();render();
</script>
