<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Frota da Saúde Rastreável — Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --p:#0B5468;--p-d:#073A49;--p-2:#0E6D85;--p-l:#E2EFF2;--p-ll:#F1F7F8;
  --bg:#F3F6F7;--card:#FFFFFF;--ink:#132A31;--ink-2:#4A6168;--line:#D7E2E5;
  --g:#1D7F45;--g-l:#E3F4E9;--y:#9A6700;--y-b:#E8A900;--y-l:#FFF4D4;--r:#B42323;--r-l:#FBE5E5;
  --shadow:0 1px 2px rgba(7,58,73,.06),0 4px 14px rgba(7,58,73,.06);
  --rad:14px;--rad-s:10px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --p:#4FB3CC;--p-d:#0D3440;--p-2:#6CC4D9;--p-l:#123843;--p-ll:#0F2A32;
  --bg:#0A1A1F;--card:#10252C;--ink:#E4F0F2;--ink-2:#9DB6BC;--line:#21414A;
  --g:#4CC27E;--g-l:#123326;--y:#F2C14E;--y-b:#E8A900;--y-l:#33290F;--r:#F07070;--r-l:#3A1717;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --p:#4FB3CC;--p-d:#0D3440;--p-2:#6CC4D9;--p-l:#123843;--p-ll:#0F2A32;
  --bg:#0A1A1F;--card:#10252C;--ink:#E4F0F2;--ink-2:#9DB6BC;--line:#21414A;
  --g:#4CC27E;--g-l:#123326;--y:#F2C14E;--y-b:#E8A900;--y-l:#33290F;--r:#F07070;--r-l:#3A1717;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--p-2);outline-offset:2px;border-radius:6px}
h1,h2,h3,h4{margin:0;line-height:1.25}
h1{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:700}
h3{font-size:.98rem;font-weight:650}
p{margin:.25rem 0}
small,.muted{color:var(--ink-2)}
.ico{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ico.s{width:16px;height:16px}.ico.l{width:26px;height:26px}

/* layout */
.app{display:flex;min-height:100vh}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--p);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
:root[data-theme="dark"] .top{background:var(--p-d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .top{background:var(--p-d)}}
.top .t{flex:1;min-width:0}
.top .t b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t span{font-size:.75rem;opacity:.85}
.iconbtn{position:relative;display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:inherit;cursor:pointer}
.iconbtn:hover{background:rgba(255,255,255,.12)}
.badge{position:absolute;top:5px;right:5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#E8A900;color:#1d1300;font-size:.7rem;font-weight:700;display:grid;place-items:center}
.content{padding:16px 14px 100px;max-width:1200px;width:100%;margin:0 auto}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.bnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:.68rem;font-weight:600;color:var(--ink-2);cursor:pointer;border-radius:10px;min-height:52px}
.bnav button.on{color:var(--p);background:var(--p-ll)}
.drawer{position:fixed;inset:0;z-index:50;display:none}
.drawer.open{display:block}
.drawer .scrim{position:absolute;inset:0;background:rgba(5,25,31,.45)}
.drawer nav{position:absolute;top:0;bottom:0;left:0;width:min(320px,86vw);background:var(--card);overflow:auto;padding:calc(14px + env(safe-area-inset-top,0px)) 10px calc(14px + env(safe-area-inset-bottom,0px))}
.navlist a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:550;min-height:46px}
.navlist a:hover{background:var(--p-ll)}
.navlist a.on{background:var(--p-l);color:var(--p)}
.navlist a.lock{color:var(--ink-2)}
.navlist .grp{font-size:.74rem;font-weight:700;color:var(--ink-2);padding:14px 12px 4px}
.who{display:flex;gap:10px;align-items:center;padding:6px 8px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.av{width:40px;height:40px;border-radius:50%;background:var(--p-l);color:var(--p);display:grid;place-items:center;font-weight:700;flex:none}
@media (min-width:980px){
  .side{display:block;width:268px;flex:none;background:var(--card);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto;padding:14px 10px}
  .bnav,.top .menu{display:none}
  .content{padding:24px 28px 48px}
}

/* components */
.pagehead{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.pagehead p{color:var(--ink-2);margin-top:4px;max-width:70ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:16px;box-shadow:var(--shadow)}
.card+.card{margin-top:12px}
.grid{display:grid;gap:12px}
@media (min-width:640px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:980px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid transparent;background:var(--p);color:#fff;font-weight:650;cursor:pointer;text-decoration:none;font-size:.95rem}
:root[data-theme="dark"] .btn:not(.sec):not(.ghost):not(.danger):not(.ok){color:#04222b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.sec):not(.ghost):not(.danger):not(.ok){color:#04222b}}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--card);color:var(--p);border-color:var(--p)}
.btn.ghost{background:transparent;color:var(--p);border-color:transparent}
.btn.danger{background:var(--r);color:#fff}
.btn.ok{background:var(--g);color:#fff}
.btn.sm{min-height:38px;padding:0 12px;font-size:.86rem;border-radius:10px}
.btn.block{width:100%}
.btn[disabled],.btn.locked{background:#C9D3D6;color:#5d6b70;border-color:transparent;cursor:not-allowed;filter:none}
:root[data-theme="dark"] .btn[disabled],:root[data-theme="dark"] .btn.locked{background:#2a3d43;color:#8aa1a7}
label.f{display:block;font-weight:600;font-size:.86rem;margin-bottom:12px}
label.f>span.h{display:block;font-weight:400;color:var(--ink-2);font-size:.8rem}
.in,select.in,textarea.in{display:block;width:100%;margin-top:5px;min-height:48px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);font-size:1rem}
textarea.in{min-height:84px;resize:vertical}
.in:focus{border-color:var(--p-2);outline:none;box-shadow:0 0 0 3px var(--p-l)}
.in.err{border-color:var(--r)}
.errmsg{color:var(--r);font-size:.82rem;font-weight:600;margin-top:4px}
.chk{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:550}
.chk input{width:22px;height:22px;accent-color:var(--p)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.76rem;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.nodot::before{display:none}
.st-g{background:var(--g-l);color:var(--g)}.st-y{background:var(--y-l);color:var(--y)}.st-r{background:var(--r-l);color:var(--r)}.st-n{background:var(--p-l);color:var(--p)}
.lbar{border-left:5px solid var(--line)}
.lbar.g{border-left-color:var(--g)}.lbar.y{border-left-color:var(--y-b)}.lbar.r{border-left-color:var(--r)}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi b{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi span{color:var(--ink-2);font-size:.84rem;font-weight:550}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:0 14px;min-height:40px;font-weight:600;font-size:.86rem;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--rad);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;color:var(--ink-2);font-weight:700;background:var(--p-ll);white-space:nowrap}
tr:last-child td{border-bottom:0}
.bar{height:9px;border-radius:6px;background:var(--p-l);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:6px;background:var(--p)}
.bar.g>i{background:var(--g)}.bar.y>i{background:var(--y-b)}.bar.r>i{background:var(--r)}
.list-item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.empty{text-align:center;color:var(--ink-2);padding:28px 10px}
.restricted{text-align:center;padding:48px 18px}
.restricted .ico{width:44px;height:44px;color:var(--ink-2)}
hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.hash{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.74rem;color:var(--ink-2);word-break:break-all}

/* stepper OS */
.steps{display:flex;gap:4px;margin:10px 0 4px}
.steps i{flex:1;height:8px;border-radius:4px;background:var(--p-l)}
.steps i.done{background:var(--p)}
.steps i.cur{background:var(--p-2);box-shadow:0 0 0 2px var(--p-l)}
.steplabels{display:flex;gap:4px;font-size:.66rem;color:var(--ink-2);font-weight:600}
.steplabels span{flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.steplabels span.cur{color:var(--p);font-weight:800}

/* alert cards */
.acard{border-radius:var(--rad);padding:14px;border:1.5px solid}
.acard.y{background:var(--y-l);border-color:var(--y-b)}
.acard.r{background:var(--r-l);border-color:var(--r)}
.acard.g{background:var(--g-l);border-color:var(--g)}
.acard h3{display:flex;gap:8px;align-items:center}

/* convocação */
.conv{background:var(--p);color:#fff;border-radius:18px;padding:18px;position:relative;overflow:hidden}
.conv .big{font-size:1.15rem;font-weight:700;line-height:1.4;margin:8px 0 14px}
.conv .btn{background:#fff;color:var(--p)}
.conv .btn.sec{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
:root[data-theme="dark"] .conv{background:var(--p-d)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .conv{background:var(--p-d)}}

/* map */
.map{position:relative;border-radius:var(--rad);overflow:hidden;border:1px solid var(--line);background:#E8F0EC}
:root[data-theme="dark"] .map{background:#0F2622}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .map{background:#0F2622}}
.map svg{display:block;width:100%;height:auto}
.map .legend{position:absolute;left:10px;bottom:10px;background:var(--card);border-radius:10px;padding:6px 10px;font-size:.72rem;display:flex;gap:10px;flex-wrap:wrap;box-shadow:var(--shadow)}
.veh{cursor:pointer}
.veh:focus{outline:none}
.veh:focus circle.body{stroke:var(--ink);stroke-width:3}

/* schedule */
.sched{position:relative;min-width:860px}
.sched .hrs,.sched .srow{display:grid;grid-template-columns:200px 1fr}
.sched .hrs div.tl{display:grid;grid-template-columns:repeat(16,1fr);font-size:.7rem;color:var(--ink-2);font-weight:600}
.sched .srow{border-top:1px solid var(--line);min-height:64px}
.sched .who2{padding:8px 10px;border-right:1px solid var(--line);font-size:.84rem}
.sched .lane{position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100%/16 - 1px),var(--line) calc(100%/16 - 1px),var(--line) calc(100%/16))}
.sched .lane.drop{background-color:var(--p-l)}
.task{position:absolute;top:8px;bottom:8px;border-radius:8px;background:var(--p);color:#fff;font-size:.72rem;font-weight:650;padding:4px 7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:grab;border:2px solid transparent}
.task.pend{background:var(--p-2)}
.task.mnt{background:#7A8B90;cursor:default}
.task.sel,.trayt.sel{border-color:#E8A900;box-shadow:0 0 0 3px rgba(232,169,0,.35)}
.tray{display:flex;gap:8px;flex-wrap:wrap;padding:10px;border:2px dashed var(--line);border-radius:var(--rad);margin-bottom:12px;min-height:56px}
.trayt{background:var(--card);border:2px solid var(--p-2);color:var(--ink);border-radius:10px;padding:8px 10px;font-size:.8rem;font-weight:600;cursor:grab;min-height:44px}

/* modal & toast */
.modal{position:fixed;inset:0;z-index:80;display:none;align-items:flex-end;justify-content:center;background:rgba(5,25,31,.5)}
.modal.open{display:flex}
.modal .box{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.modal{align-items:center}.modal .box{border-radius:20px}}
.modal .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--ink);color:var(--card);padding:12px 18px;border-radius:12px;font-weight:600;font-size:.9rem;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25);display:none}
.toast.show{display:block}
@media (min-width:980px){.toast{bottom:24px}}

/* evidences */
.ev{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:700px){.ev{grid-template-columns:repeat(3,minmax(0,1fr))}}
.evslot{border:2px dashed var(--line);border-radius:12px;padding:12px;min-height:118px;display:flex;flex-direction:column;gap:6px;justify-content:space-between;font-size:.84rem}
.evslot.ok{border-style:solid;border-color:var(--g);background:var(--g-l)}
.evslot .thumb{height:54px;border-radius:8px;background:linear-gradient(135deg,var(--p-l),var(--p-ll));display:grid;place-items:center;color:var(--p);overflow:hidden}
.evslot .thumb img{width:100%;height:100%;object-fit:cover}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,var(--p) 0,var(--p) 34vh,var(--bg) 34vh)}
.login .box{width:100%;max-width:420px}
.brand{color:#fff;margin-bottom:18px;display:flex;gap:12px;align-items:center}
.brand .mk{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.brand b{font-size:1.2rem;display:block}
.brand span{font-size:.84rem;opacity:.85}
.demo{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.demo button{min-height:52px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;cursor:pointer;font-size:.8rem;font-weight:600;text-align:left;padding:8px 10px;line-height:1.25}
.demo button small{display:block;font-weight:500}
.tabs{display:flex;gap:4px;background:var(--p-ll);padding:4px;border-radius:12px;margin-bottom:16px}
.tabs button{flex:1;border:0;background:none;min-height:42px;border-radius:9px;font-weight:650;cursor:pointer;color:var(--ink-2)}
.tabs button.on{background:var(--card);color:var(--p);box-shadow:var(--shadow)}

.score{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.15rem;flex:none}
.cmp{display:grid;gap:12px}
@media (min-width:700px){.cmp{grid-template-columns:repeat(var(--n,2),minmax(0,1fr))}}
.cmp .best{border:2px solid var(--g)}
.hbar{display:grid;grid-template-columns:130px 1fr 90px;gap:10px;align-items:center;font-size:.84rem;margin:7px 0}
.hbar .bar{height:14px}
@media (max-width:520px){.hbar{grid-template-columns:96px 1fr 76px}}
.vbars{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:10px}
.vbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.7rem;color:var(--ink-2);height:100%;justify-content:flex-end}
.vbars i{display:block;width:100%;max-width:38px;border-radius:6px 6px 0 0;background:var(--p)}
.vbars i.c{background:#E8A900}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--p-ll);border:1px solid var(--p-l);font-size:.9rem}
.chat{display:flex;flex-direction:column;gap:8px;max-height:360px;overflow:auto;padding:4px}
.msg{max-width:80%;padding:9px 12px;border-radius:14px;background:var(--p-ll);font-size:.9rem}
.msg.me{align-self:flex-end;background:var(--p);color:#fff}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root{--o:#C2410C;--o-l:#FFEDD5;--b:#1D4ED8;--b-l:#DBEAFE;--x:#5B6B70;--x-l:#E9EEEF;--mapbg:#E8F0EC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--o:#FB923C;--o-l:#3A2312;--b:#7EA6FF;--b-l:#16244A;--x:#A6B5BA;--x-l:#1C2F35;--mapbg:#0F2622}}
:root[data-theme="dark"]{--o:#FB923C;--o-l:#3A2312;--b:#7EA6FF;--b-l:#16244A;--x:#A6B5BA;--x-l:#1C2F35;--mapbg:#0F2622}
.alv{border-radius:var(--rad);background:var(--card);border:1.5px solid var(--line);border-left:6px solid;overflow:hidden}
.alv-h{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px}
.alv-b{display:flex;gap:14px;padding:0 14px 14px;flex-wrap:wrap}
.alv-map{width:180px;flex:none;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.alv-map svg,.mini{display:block;width:100%;height:auto}
@media (max-width:520px){.alv-map{width:100%}}
.lvbadge{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border-radius:999px;font-weight:800;font-size:.78rem;color:#fff}
.lv-crit{border-left-color:var(--r)}.lv-crit .alv-h{background:var(--r-l)}.lv-crit .lvbadge{background:var(--r)}
.lv-aten{border-left-color:var(--o)}.lv-aten .alv-h{background:var(--o-l)}.lv-aten .lvbadge{background:var(--o)}
.lv-info{border-left-color:var(--b)}.lv-info .alv-h{background:var(--b-l)}.lv-info .lvbadge{background:var(--b)}
.lv-res{border-left-color:var(--x)}.lv-res .alv-h{background:var(--x-l)}.lv-res .lvbadge{background:var(--x)}.alv.lv-res{opacity:.85}
:root[data-theme="dark"] .lvbadge{color:#0A1A1F}

const me=()=>S.sess?S.users.find(u=>u.cpf===S.sess):null;

const dStatus={disp:['Disponível','g'],viagem:['Em viagem','y'],folga:['De folga','r'],afastado:['Afastado','r']};
const diasAte=d=>Math.round((new Date(d)-new Date('2026-10-05'))/864e5);
function cnhAlerta(d){const n=diasAte(d.val);if(n<0)return['Vencida','r'];if(n<=30)return['Vence em '+n+' dias','y'];return['Válida até '+d.val.split('-').reverse().join('/'),'g']}
let horasSemana=did=>{const d=D(did);return (d?d.base:0)+S.trips.filter(t=>t.mot===did&&t.st!=='recusada'&&t.dia<5).reduce((a,t)=>a+dur(t.ini,t.fim),0)};
const tripsDia=(did,dia)=>S.trips.filter(t=>t.mot===did&&t.dia===dia&&t.st!=='recusada');
const sobrepoe=(a,b)=>a.dia===b.dia&&toMin(a.ini)<toMin(b.fim)&&toMin(b.ini)<toMin(a.fim);
const osTotal=o=>{const q=o.orc.find(x=>x.of===o.escolhido);return q?q.itens.reduce((a,i)=>a+i[1],0):0};
const qTotal=q=>q.itens.reduce((a,i)=>a+i[1],0);
const gastoVei=vid=>S.gastos.filter(g=>g.vei===vid).reduce((a,g)=>a+g.v,0);
function vehAlerts(v){const r=S.regras;const out=[];const falta=v.proxOleo-v.km;
 if(falta<=0)out.push({n:'r',t:'Troca de óleo vencida há '+num(-falta)+' km',serv:'Troca de óleo e filtros'});else if(falta<=r.avisoKm)out.push({n:'y',t:'Troca de óleo em '+num(falta)+' km',serv:'Troca de óleo e filtros'});
 const dias=-diasAte(v.ultRev);if(dias>=r.revisaoDias)out.push({n:'r',t:'Revisão vencida: '+dias+' dias desde a última',serv:'Revisão periódica'});else if(dias>=r.revisaoDias-30)out.push({n:'y',t:'Revisão em '+(r.revisaoDias-dias)+' dias',serv:'Revisão periódica'});
 if(v.sensor&&v.estado!=='oficina')out.push({n:'y',t:'Sensor: '+v.sensor,serv:v.sensor.includes('Pastilha')?'Substituição de pastilhas de freio':'Diagnóstico de sensor'});return out}
function dispVeic(v,dia,ini,fim){if(v.status==='r')return false;if(v.bloqDias&&v.bloqDias.includes(dia))return false;return !S.trips.some(t=>t.vei===v.id&&t.st!=='recusada'&&sobrepoe(t,{dia,ini,fim}))}
function conflitos(did,trip,ignoreId){const d=D(did);const out=[];const v=trip.vei?V(trip.vei):null;
 if(d.status==='afastado'||d.status==='folga')out.push({g:'r',t:d.nome.split(' ')[0]+' está '+dStatus[d.status][0].toLowerCase()+'.'});
 if(cnhAlerta(d)[1]==='r')out.push({g:'r',t:'CNH vencida.'});
 S.trips.filter(t=>t.mot===did&&t.id!==ignoreId&&t.st!=='recusada').forEach(t=>{if(sobrepoe(t,trip))out.push({g:'r',t:'Já escalado no mesmo horário: '+t.dest+' '+t.ini+'–'+t.fim+'.'})});
 if(v&&(!d.tipos.includes(v.tipo)||!CNH_OK[v.tipo].includes(d.cnh)))out.push({g:'r',t:'Sem habilitação para '+TIPO[v.tipo].toLowerCase()+' (CNH '+d.cnh+').'});
 const h=horasSemana(did)+dur(trip.ini,trip.fim);if(h>S.regras.cargaMax)out.push({g:'y',t:'Carga semanal passaria para '+h.toFixed(1)+' h (limite '+S.regras.cargaMax+' h).'});
 return out}
function sugerir(trip){const pax=trip.pax||1;const tipos=pax>15?['onibus']:pax>4?['van','onibus']:['carro','van','onibus'];
 const vs=S.vehicles.filter(v=>tipos.includes(v.tipo)&&v.status!=='r'&&dispVeic(v,trip.dia,trip.ini,trip.fim)).sort((a,b)=>(tipos.indexOf(a.tipo)-tipos.indexOf(b.tipo))||((trip.pac?(b.prio-a.prio):0))||(a.status==='g'?-1:1)||(a.km-b.km));
 for(const v of vs){const ds=S.drivers.filter(d=>!conflitos(d.id,{...trip,vei:v.id}).some(c=>c.g==='r')).sort((a,b)=>horasSemana(a.id)-horasSemana(b.id));if(ds.length)return{v,d:ds[0]}}return null}

function closeModal(){$('#modal').classList.remove('open')}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3200)}

/* ========== LOGIN ========== */
let loginTab='entrar';
function viewLogin(){
 const demos=[['motorista','Motorista','João Batista'],['paciente','Paciente','Antônia Ribeiro'],['gestor','Gestor de Frota','Regina Moraes'],['secretaria','Secretaria','Saúde'],['admin','Administrador','TI'],['prime','PRIME','Abastecimento e lavagem']];
 return `<div class="login"><div class="box">
 <div class="brand"><div class="mk">${ic('shield','l')}</div><div><b>Frota da Saúde Rastreável</b><span>Prefeitura Municipal de Campo Mourão</span></div></div>
 <div class="card">
 <div class="tabs" role="tablist"><button class="${loginTab==='entrar'?'on':''}" data-act="loginTab" data-t="entrar" role="tab">Entrar</button><button class="${loginTab==='cad'?'on':''}" data-act="loginTab" data-t="cad" role="tab">Criar cadastro</button></div>
 ${loginTab==='entrar'?`
 <form id="fLogin" novalidate>
  <label class="f">CPF<input class="in mono" id="lcpf" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" maxlength="14" data-mask="cpf"></label>
  <label class="f">Senha<input class="in" id="lsenha" type="password" autocomplete="current-password" placeholder="Sua senha"></label>
  <div id="lerr" class="errmsg" role="alert"></div>
  <button class="btn block" type="submit" style="margin-top:6px">Entrar</button>
 </form>
 <hr><p class="muted" style="font-size:.84rem">Protótipo: escolha um perfil para preencher CPF e senha de teste.</p>
 <div class="demo">${demos.map(d=>`<button data-act="demo" data-p="${d[0]}">${d[1]}<small class="muted">${d[2]}</small></button>`).join('')}</div>`
 :`<form id="fCad" novalidate>
  <p class="muted" style="margin-bottom:12px;font-size:.88rem">Só pedimos o essencial. O Administrador aprova o cadastro e define o seu perfil de acesso.</p>
  <label class="f">Nome completo<input class="in" id="cnome" autocomplete="name"></label>
  <label class="f">CPF<input class="in mono" id="ccpf" inputmode="numeric" placeholder="000.000.000-00" maxlength="14" data-mask="cpf"></label>
  <label class="f">Lotação ou empresa<span class="h">Ex.: Motorista da Saúde, matrícula 4471</span><input class="in" id="clot"></label>
  <label class="f">Senha<span class="h">Mínimo de 6 caracteres</span><input class="in" id="csenha" type="password" autocomplete="new-password"></label>
  <div id="cerr" class="errmsg" role="alert"></div>
  <button class="btn block" type="submit">Enviar cadastro</button></form>`}
 </div>
 <p class="muted" style="text-align:center;font-size:.78rem;margin-top:14px">Dados fictícios para demonstração · data simulada: ${AGORA.txt}</p>
 </div></div>`}

/* ========== SHELL ========== */
let route='';
function navHTML(u){const p=u.perfil;return `<div class="who"><div class="av">${esc(u.nome.split(' ').map(x=>x[0]).slice(0,2).join(''))}</div><div style="min-width:0"><b style="display:block;font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(u.nome)}</b><small>${PERFIS[p]}</small></div></div>
 <div class="navlist">${MENU[p].map(g=>`<div class="grp">${g[0]}</div>`+g[1].map(r=>{const lock=RESTRITO.includes(r)&&p!=='gestor';return `<a href="#/${r}" class="${route===r?'on':''} ${lock?'lock':''}">${ic(lock?'lock':ROTAS[r][1])}<span>${ROTAS[r][0]}</span></a>`}).join('')).join('')}
 <div class="grp">Sessão</div><a href="#" data-act="theme">${ic('star')}<span>Configurações: alternar tema (padrão claro)</span></a><a href="#" data-act="reset">${ic('history')}<span>Restaurar dados de demonstração</span></a><a href="#" data-act="logout">${ic('logout')}<span>Sair / trocar perfil</span></a></div>`}
function unread(u){return S.notif.filter(n=>!n.lida&&notifMine(n,u)).length}
function notifMine(n,u){return n.para===u.perfil||n.para===u.ref||(u.perfil==='gestor'&&n.para==='gestor')}
function shell(u,html){const p=u.perfil;const n=unread(u);
 return `<div class="app"><aside class="side">${navHTML(u)}</aside><div class="main">
 <header class="top"><button class="iconbtn menu" data-act="drawer" aria-label="Abrir menu">${ic('menu')}</button><div class="t"><b>${ROTAS[route]?ROTAS[route][0]:''}</b><span>${PERFIS[p]} · ${AGORA.txt}</span></div>
 <a class="iconbtn" href="#/notificacoes" aria-label="Notificações: ${n} não lidas">${ic('bell')}${n?`<span class="badge">${n}</span>`:''}</a>${LEGENDA}</header>
 <main class="content" id="page">${html}</main></div></div>
 <nav class="bnav" aria-label="Navegação principal">${BNAV[p].map(r=>`<button class="${route===r?'on':''}" data-act="go" data-r="${r}">${ic(ROTAS[r][1])}<span>${SHORT[r]||ROTAS[r][0]}</span></button>`).join('')}<button data-act="drawer">${ic('more')}<span>Mais</span></button></nav>
 <div class="drawer" id="drawer"><div class="scrim" data-act="drawer"></div><nav>${navHTML(u)}</nav></div>`}
function head(t,sub,acts=''){return `<div class="pagehead"><div><h1>${t}</h1>${sub?`<p>${sub}</p>`:''}</div>${acts?`<div class="row">${acts}</div>`:''}</div>`}
function restricted(){return `<div class="card restricted">${ic('lock')}<h1 style="margin-top:10px">Acesso restrito</h1><p class="muted" style="max-width:44ch;margin:8px auto 0">Esta área é exclusiva do Gestor de Frota/Patrimônio. A tentativa de acesso foi registrada na trilha de auditoria.</p></div>`}

function render(){
 const u=me();const r=location.hash.replace('#/','').split('?')[0];
 if(!u){$('#root').innerHTML=viewLogin();return}
 route=ROTAS[r]?r:HOME[u.perfil];
 let html;
 if(RESTRITO.includes(route)&&u.perfil!=='gestor'){html=restricted();if(lastDenied!==route){audit('Tentativa de acesso negada: '+ROTAS[route][0],route);lastDenied=route}}
 else if(!PERM[u.perfil].has(route)&&!(route==='osdet')){html=restricted()}
 else {lastDenied='';html=(PAGES[route]||(()=>'<div class="empty">Em construção</div>'))(u)}
 $('#root').innerHTML=shell(u,html);
 if(AFTER[route])AFTER[route](u);
 window.scrollTo(0,0);
}
let lastDenied='';
const PAGES={},AFTER={};
let F={}; /* filtros de tela */

/* ========== MAPA ========== */
function vehPos(v){
 const t=S.trips.find(x=>x.vei===v.id&&x.st==='andamento');
 if(v.estado==='oficina'){const o=S.os.find(o=>o.vei===v.id&&o.etapa<5);const w=o&&o.escolhido?W(o.escolhido):W('w2');return[w.x+6,w.y-6]}
 if(v.id==='v6'&&t)return[178+Math.sin(Date.now()/2000)*2,104];
 if(t&&ROUTES[t.dest]){const p=v._p??(v.id==='v1'?.52:.58);return along(ROUTES[t.dest],p)}
 if(t)return[196,158];
 const i=S.vehicles.filter(x=>x.estado==='parado').indexOf(v);return[150+(i%3)*12,186+Math.floor(i/3)*12]}
function along(pts,f){let L=0;const seg=[];for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);L+=d}let t=f*L;for(let i=0;i<seg.length;i++){if(t<=seg[i]){const k=t/seg[i];return[pts[i][0]+(pts[i+1][0]-pts[i][0])*k,pts[i][1]+(pts[i+1][1]-pts[i][1])*k]}t-=seg[i]}return pts[pts.length-1]}
function vColor(v){const al=S.alerts.some(a=>a.vei===v.id&&a.st==='aberto'&&a.nivel==='r');return v.status==='r'?'var(--r)':(v.status==='y'||al)?'#E8A900':'var(--g)'}
function mapSVG(sel){
 const roads=Object.entries(ROUTES).filter(([k])=>k!=='Londrina').map(([k,p])=>`<polyline points="${p.map(x=>x.join(',')).join(' ')}" fill="none" stroke="#B9C7C2" stroke-width="5" stroke-linecap="round"/><polyline points="${p.map(x=>x.join(',')).join(' ')}" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 6" opacity=".8"/>`).join('');
 const cities=[['Campo Mourão',190,160,16],['Peabiru',250,138,5],['Araruna',175,95,5],['Mamborê',140,250,5],['Luiziana',250,240,5]];
 const vs=S.vehicles.map(v=>{const[x,y]=vehPos(v);const c=vColor(v);const t=S.trips.find(t=>t.vei===v.id&&t.st==='andamento');
  return `<g class="veh" tabindex="0" role="button" data-act="vehInfo" data-id="${v.id}" aria-label="${v.placa} ${v.modelo}" transform="translate(${x.toFixed(1)},${y.toFixed(1)})">${v.prio?`<circle r="10" fill="none" stroke="${c}" stroke-width="1.5" stroke-dasharray="2 2"/>`:''}<circle class="body" r="6.5" fill="${c}" stroke="#fff" stroke-width="2"/><text y="2.6" text-anchor="middle" font-size="7" font-weight="900" fill="${c==='#E8A900'?'#1d1300':'#fff'}">${c==='#E8A900'?'!':c.includes('--r')?'✕':'✓'}</text>${sel===v.id?'<circle r="13" fill="none" stroke="var(--p)" stroke-width="2.5"/>':''}${v.estado!=='parado'||sel===v.id?`<text x="9" y="-8" font-size="7.5" font-weight="700" fill="#21363c" paint-order="stroke" stroke="#fff" stroke-width="2.5">${v.placa}${t?' · '+esc(D(t.mot).nome.split(' ')[0]):''} · ${syncHora(v).slice(6)}</text>`:''}</g>`}).join('');
 return `<div class="map"><svg viewBox="0 0 420 300" role="img" aria-label="Mapa da região de Campo Mourão com a posição dos veículos">
 <path d="M0 210 C 60 200, 90 230, 150 215 S 260 260, 420 230" fill="none" stroke="#9CC7DC" stroke-width="4" opacity=".7"/>
 <circle cx="190" cy="160" r="26" fill="#D6E3DE"/>${roads}<rect x="140" y="177" width="44" height="${12*Math.ceil(S.vehicles.filter(v=>v.estado==='parado').length/3)+8}" rx="6" fill="#fff" opacity=".55" stroke="#9BB0AA" stroke-dasharray="3 2"/><text x="140" y="174" font-size="7" font-weight="700" fill="#5B7077">Pátio</text>
 ${cities.map(c=>`<circle cx="${c[1]}" cy="${c[2]}" r="${c[3]===16?3:3}" fill="#5B7077"/><text x="${c[1]+5}" y="${c[2]+(c[3]===16?18:12)}" font-size="${c[3]===16?9:7.5}" font-weight="${c[3]===16?700:600}" fill="#5B7077">${c[0]}</text>`).join('')}
 <text x="404" y="262" font-size="8" text-anchor="end" font-weight="700" fill="#5B7077">Curitiba ↘ 455 km</text><text x="404" y="20" font-size="8" text-anchor="end" font-weight="700" fill="#5B7077">Maringá ↗ 91 km</text><text x="8" y="232" font-size="8" font-weight="700" fill="#5B7077">↙ Cascavel</text>
 ${S.workshops.map(w=>`<rect x="${w.x-3}" y="${w.y-3}" width="6" height="6" rx="1.5" fill="#5B7077" opacity=".7"><title>${esc(w.nome)}</title></rect>`).join('')}
 ${vs}</svg>
 <div class="legend"><span><b style="color:var(--g)">●</b> Apto</span><span><b style="color:#E8A900">●</b> Atenção</span><span><b style="color:var(--r)">●</b> Bloqueado</span><span>◌ Prioritário</span><span>▪ Oficina</span><span>Posição na última sincronização</span></div></div>`}
let mapTimer=null;
function startMap(){clearInterval(mapTimer);mapTimer=setInterval(()=>{if(route!=='painel'||!$('#mapbox')){clearInterval(mapTimer);return}S.vehicles.forEach(v=>{if(v.estado==='viagem')v._p=Math.min(.97,(v._p??(v.id==='v1'?.52:.58))+.004)});$('#mapbox').innerHTML=mapSVG(F.selV)},1500)}

/* ========== 26 PAINEL ========== */
PAGES.painel=u=>{
 const f=F.painel||'todos';const vs=S.vehicles.filter(v=>f==='todos'||(f==='prio'?v.prio:v.estado===f));
 const k={viagem:0,parado:0,oficina:0};S.vehicles.forEach(v=>k[v.estado]++);const bloq=S.vehicles.filter(v=>v.status==='r').length;
 const al=S.alerts.filter(a=>a.st==='aberto');
 return head('Painel da frota','Toque em um veículo para ver quem está dirigindo e quando foi a última atualização.')+syncNotice()+
 `<div class="grid g4" style="margin-bottom:12px">
  <div class="card kpi lbar y"><b>${k.viagem}</b><span>Em viagem (última leitura)</span></div><div class="card kpi lbar g"><b>${k.parado}</b><span>Parados no pátio</span></div>
  <div class="card kpi lbar r"><b>${k.oficina}</b><span>Na oficina</span></div><a href="#/alertas" class="card kpi lbar r" style="text-decoration:none;color:inherit"><b>${al.length}</b><span>Alertas abertos do rastreador</span></a></div>
 <div class="grid split"><div><div class="chips">${[['todos','Todos'],['viagem','Em viagem'],['parado','Parados'],['oficina','Na oficina'],['prio','Prioritários']].map(c=>`<button class="chip ${f===c[0]?'on':''}" data-act="fPainel" data-f="${c[0]}">${c[1]}</button>`).join('')}</div>
 <div id="mapbox">${mapSVG(F.selV)}</div><div id="vinfo" style="margin-top:12px">${F.selV?vehCard(V(F.selV)):''}</div></div>
 <div class="card" style="padding:6px 14px"><h2 style="padding:10px 0 4px">Veículos (${vs.length})</h2>${vs.map(v=>{const t=S.trips.find(t=>t.vei===v.id&&t.st==='andamento');return `<div class="list-item" role="button" tabindex="0" data-act="vehInfo" data-id="${v.id}" style="cursor:pointer"><span style="width:12px;height:12px;border-radius:50%;background:${vColor(v)};margin-top:6px;flex:none"></span><div style="flex:1;min-width:0"><div class="row between"><b class="mono">${v.placa}</b>${v.prio?'<span class="pill nodot st-n">Prioritário</span>':''}</div><small>${esc(v.modelo)} · ${v.sec} · atualizado ${syncHora(v)}</small><div style="font-size:.84rem">${v.estado==='viagem'&&t?`Em viagem → ${t.dest} · ${esc(D(t.mot).nome)}`:v.estado==='oficina'?'Na oficina · bloqueado':'Parado no pátio'}</div></div></div>`}).join('')}</div></div>`};
function vehCard(v){if(!v)return'';const t=S.trips.find(t=>t.vei===v.id&&t.st==='andamento');const al=S.alerts.filter(a=>a.vei===v.id&&a.st==='aberto');
 return `<div class="card"><div class="row between"><h2 class="mono">${v.placa}</h2>${stPill(v.status)}</div><p class="muted">${esc(v.modelo)} · ${TIPO[v.tipo]} · ${v.sec} · ${num(v.km)} km</p>${vehExtra(v)}
 ${t?`<p><b>${esc(D(t.mot).nome)}</b> dirigindo para ${t.dest} (${esc(t.local)}) · ${t.ini}–${t.fim} · ${t.pax} ${t.pac?'pacientes':'passageiros'}</p>`:v.estado==='oficina'?'<p>Na oficina — retirado da escala.</p>':'<p>Parado no pátio, sem viagem em andamento.</p>'}
 ${al.map(a=>`<div class="notice" style="margin-top:8px;background:${a.nivel==='crit'?'var(--r-l)':'var(--y-l)'};border-color:transparent">${ic('alert')}<div><b>${a.tipo}</b><br>${esc(a.txt)}</div></div>`).join('')}
 <div class="row" style="margin-top:10px"><a class="btn sm sec" href="#/historico">Histórico de uso</a>${al.length?'<a class="btn sm" href="#/alertas">Ver alertas</a>':''}</div></div>`}
AFTER.painel=startMap;

/* ========== 27 ALERTAS ========== */
PAGES.alertas=u=>{const ab=S.alerts.filter(a=>a.st==='aberto'),fe=S.alerts.filter(a=>a.st!=='aberto');
 return head('Alertas do rastreador','Desvios de rota, horário, velocidade, paradas e suspeitas. Cada resposta fica registrada na auditoria.')+
 `<div class="stack">${ab.length?ab.map(a=>{const v=V(a.vei);return `<div class="acard ${a.nivel}"><h3>${ic('alert')} ${a.tipo} · <span class="mono">${v.placa}</span></h3><p>${esc(a.txt)}</p><p class="muted" style="font-size:.84rem">${a.quando} · ${a.mot?esc(D(a.mot).nome):'Sem motorista designado'} · ${esc(v.modelo)}</p>
  ${a.pergunta?`<p style="font-weight:700;margin-top:8px">Este veículo deveria estar aqui?</p><div class="row" style="margin-top:6px"><button class="btn sm ok" data-act="alertResp" data-id="${a.id}" data-r="sim">Sim, está autorizado</button><button class="btn sm danger" data-act="alertResp" data-id="${a.id}" data-r="nao">Não — acionar motorista</button></div>`
  :`<div class="row" style="margin-top:8px"><button class="btn sm sec" data-act="alertResp" data-id="${a.id}" data-r="ciente">Registrar ciência</button>${/uso indevido|roubo/i.test(a.tipo)?`<button class="btn sm danger" data-act="alertResp" data-id="${a.id}" data-r="bloq">Bloquear veículo e acionar segurança</button>`:''}</div>`}</div>`}).join(''):'<div class="card empty">Nenhum alerta aberto. A frota está dentro das regras.</div>'}</div>
 ${fe.length?`<h2 style="margin:22px 0 10px">Tratados hoje</h2><div class="card" style="padding:4px 16px">${fe.map(a=>`<div class="list-item"><div style="flex:1"><b>${a.tipo}</b> · <span class="mono">${V(a.vei).placa}</span><br><small>${esc(a.resp||'')}</small></div></div>`).join('')}</div>`:''}`};

/* ========== 28 HISTÓRICO ========== */
PAGES.historico=u=>{const fv=F.hv||'',fd=F.hd||'';
 const atual=S.trips.filter(t=>t.st==='concluida'||t.st==='andamento').map(t=>({data:'05/10/2026',mot:t.mot,vei:t.vei,dest:t.dest,km:t.kmFim?t.kmFim-t.kmIni:null,fin:t.fin,and:t.st==='andamento'}));
 const rows=[...atual,...S.hist.slice().reverse()].filter(h=>(!fv||h.vei===fv)&&(!fd||h.mot===fd));
 const totKm=rows.reduce((a,h)=>a+(h.km||0),0);
 return head('Histórico de uso e rotas','Quem usou cada veículo, para onde foi, quando e quantos quilômetros rodou.')+
 `<div class="grid g2" style="margin-bottom:12px"><label class="f" style="margin:0">Veículo<select class="in" data-act-change="fHist" data-k="hv"><option value="">Todos</option>${S.vehicles.map(v=>`<option value="${v.id}" ${fv===v.id?'selected':''}>${v.placa} — ${esc(v.modelo)}</option>`).join('')}</select></label>
 <label class="f" style="margin:0">Motorista<select class="in" data-act-change="fHist" data-k="hd"><option value="">Todos</option>${S.drivers.map(d=>`<option value="${d.id}" ${fd===d.id?'selected':''}>${esc(d.nome)}</option>`).join('')}</select></label></div>
 <p class="muted" style="margin-bottom:8px">${rows.length} registros · ${num(totKm)} km rodados</p>
 <div class="tbl-wrap"><table><thead><tr><th>Data</th><th>Veículo</th><th>Motorista</th><th>Destino</th><th>Finalidade</th><th>Km</th></tr></thead><tbody>${rows.map(h=>`<tr><td class="mono">${h.data}</td><td class="mono">${V(h.vei).placa}</td><td>${esc(D(h.mot).nome)}</td><td>${h.dest}</td><td>${esc(h.fin)}</td><td class="mono">${h.and?'<span class="pill st-y">em curso</span>':h.km==null?'—':num(h.km)}</td></tr>`).join('')}</tbody></table></div>`};
/* ========== 8 MOTORISTAS ========== */
PAGES.motoristas=u=>head('Motoristas','Habilitação, validade da CNH e tipos de veículo que cada servidor pode dirigir.',`<button class="btn" data-act="novoMot">${ic('plus')} Cadastrar motorista</button>`)+
 `<div class="tbl-wrap"><table><thead><tr><th>Nome</th><th>CPF</th><th>Secretaria</th><th>CNH</th><th>Validade</th><th>Pode dirigir</th><th>Status</th><th></th></tr></thead><tbody>${S.drivers.map(d=>{const c=cnhAlerta(d);const s=dStatus[d.status];return `<tr><td><b>${esc(d.nome)}</b></td><td class="mono">${fmtCPF(d.cpf)}</td><td>${d.sec}</td><td>${d.cnh}</td><td><span class="pill st-${c[1]}">${c[0]}</span></td><td>${d.tipos.map(t=>TIPO[t]).join(', ')}</td><td><span class="pill st-${s[1]}">${s[0]}</span></td><td><button class="btn sm ghost" data-act="editMot" data-id="${d.id}">Editar</button></td></tr>`}).join('')}</tbody></table></div>`;
function motForm(d){d=d||{nome:'',cpf:'',sec:'Saúde',cnh:'B',val:'',tipos:['carro'],status:'disp'};
 modal(d.id?'Editar motorista':'Cadastrar motorista',`<form id="fMot" data-id="${d.id||''}"><label class="f">Nome<input class="in" name="nome" value="${esc(d.nome)}" required></label>
 <label class="f">CPF<input class="in mono" name="cpf" data-mask="cpf" maxlength="14" value="${d.cpf?fmtCPF(d.cpf):''}" required></label>
 <div class="grid g2"><label class="f">Secretaria<select class="in" name="sec">${Object.keys(S.dotacoes).map(s=>`<option ${d.sec===s?'selected':''}>${s}</option>`).join('')}</select></label>
 <label class="f">Status<select class="in" name="status">${Object.entries(dStatus).map(([k,v])=>`<option value="${k}" ${d.status===k?'selected':''}>${v[0]}</option>`).join('')}</select></label>
 <label class="f">Categoria da CNH<select class="in" name="cnh">${['B','C','D','E'].map(c=>`<option ${d.cnh===c?'selected':''}>${c}</option>`).join('')}</select></label>
 <label class="f">Validade da CNH<input class="in" type="date" name="val" value="${d.val}" required></label></div>

PAGES.disponiveis=u=>{const f=F.disp||{dia:0,hora:'14:00',tipo:'',sec:''};F.disp=f;const fake={dia:+f.dia,ini:f.hora,fim:f.hora.replace(/^(\d+)/,h=>String(Math.min(23,+h+1)).padStart(2,'0'))};
 const ds=S.drivers.filter(d=>(!f.tipo||d.tipos.includes(f.tipo))&&(!f.sec||d.sec===f.sec));
 return head('Motoristas disponíveis','Filtre por dia, horário, tipo de veículo e secretaria. Verde = livre, amarelo = atenção, vermelho = indisponível.')+
 `<div class="card" style="margin-bottom:12px"><div class="grid g4"><label class="f" style="margin:0">Dia<select class="in" data-act-change="fDisp" data-k="dia">${DIAS.map((d,i)=>`<option value="${i}" ${+f.dia===i?'selected':''}>${d}</option>`).join('')}</select></label>

 <label class="f" style="margin:0">Tipo de veículo<select class="in" data-act-change="fDisp" data-k="tipo"><option value="">Qualquer</option>${Object.entries(TIPO).map(([k,v])=>`<option value="${k}" ${f.tipo===k?'selected':''}>${v}</option>`).join('')}</select></label>
 <label class="f" style="margin:0">Secretaria<select class="in" data-act-change="fDisp" data-k="sec"><option value="">Todas</option>${Object.keys(S.dotacoes).map(s=>`<option ${f.sec===s?'selected':''}>${s}</option>`).join('')}</select></label></div></div>
 <div class="grid g3">${ds.map(d=>{const c=conflitos(d.id,fake);const h=horasSemana(d.id);const pct=Math.min(100,h/S.regras.cargaMax*100);const cor=c.some(x=>x.g==='r')?'r':(h>S.regras.cargaMax*.8||cnhAlerta(d)[1]==='y')?'y':'g';const lbl={g:'Disponível',y:'Atenção',r:'Indisponível'}[cor];const vd=tripsDia(d.id,+f.dia);
 return `<div class="card lbar ${cor}"><div class="row between"><b>${esc(d.nome)}</b><span class="pill st-${cor}">${lbl}</span></div><small>${d.sec} · CNH ${d.cnh} · ${d.tipos.map(t=>TIPO[t]).join(', ')}</small>
 <p style="margin-top:8px;font-size:.88rem">${vd.length?vd.map(t=>`${t.ini}–${t.fim} ${t.dest}`).join('<br>'):'Sem viagens neste dia'}</p>
 ${c.length?`<p style="font-size:.82rem;color:var(--${c[0].g==='r'?'r':'y'})">${esc(c[0].t)}</p>`:''}
 <div class="row between" style="margin-top:8px;font-size:.8rem"><span>Carga da semana</span><b class="mono">${h.toFixed(1)} / ${S.regras.cargaMax} h</b></div><div class="bar ${pct>100?'r':pct>80?'y':'g'}"><i style="width:${pct}%"></i></div></div>`}).join('')}</div>`};

let selTask=null;
PAGES.escala=u=>{const dia=F.edia??0;F.edia=dia;const sol=S.trips.filter(t=>!t.mot&&t.st!=='recusada'&&t.dia===dia);
 const H0=5,H1=21,span=(H1-H0)*60;const pos=t=>`left:${(toMin(t.ini)-H0*60)/span*100}%;width:${(toMin(t.fim)-toMin(t.ini))/span*100}%`;
 return head('Escala de trabalho','Arraste uma viagem até a linha do motorista para designar. No celular: toque na viagem e depois no motorista. Conflitos são verificados na hora.',`<a class="btn" href="#/plano">${ic('plus')} Nova viagem</a>`)+
 `<div class="chips"><button class="chip" data-act="eDia" data-d="${Math.max(0,Math.floor(dia/5)*5-5)}" aria-label="Semana anterior">◀</button>${DIAS.map((d,i)=>`<button class="chip ${dia===i?'on':''}" data-act="eDia" data-d="${i}">${i===0?'Hoje · ':''}${d}</button>`).slice(Math.floor(dia/5)*5,Math.floor(dia/5)*5+5).join('')}<button class="chip" data-act="eDia" data-d="${Math.min(25,Math.floor(dia/5)*5+5)}" aria-label="Próxima semana">▶</button></div>
 <h3 style="margin-bottom:6px">Aguardando motorista (${sol.length})</h3>
 <div class="tray" id="tray">${sol.length?sol.map(t=>`<div class="trayt ${selTask===t.id?'sel':''}" draggable="true" data-task="${t.id}" data-act="pickTask" data-id="${t.id}" tabindex="0">${t.ini}–${t.fim} · ${t.dest}<br><small>${esc(t.fin)} · ${t.pax} ${t.pac?'pac.':'pass.'}</small></div>`).join(''):'<span class="muted" style="align-self:center">Nenhuma viagem sem motorista neste dia.</span>'}</div>
 <div class="tbl-wrap"><div class="sched"><div class="hrs"><div></div><div class="tl">${Array.from({length:16},(_,i)=>`<span style="padding:6px 0 6px 3px">${String(H0+i).padStart(2,'0')}h</span>`).join('')}</div></div>
 ${S.drivers.map(d=>{const h=horasSemana(d.id);const pct=Math.min(100,h/S.regras.cargaMax*100);const s=dStatus[d.status];
  return `<div class="srow"><div class="who2"><b>${esc(d.nome.split(' ').slice(0,2).join(' '))}</b><div class="row" style="gap:6px;font-size:.72rem"><span class="pill st-${s[1]}" style="font-size:.66rem;padding:1px 7px">${s[0]}</span>CNH ${d.cnh}</div>${respDe(d.id)}<div class="bar ${pct>100?'r':pct>80?'y':'g'}" style="margin-top:5px;height:6px" title="Carga semanal"><i style="width:${pct}%"></i></div><small class="mono" style="font-size:.7rem">${h.toFixed(1)} / ${S.regras.cargaMax} h na semana</small></div>
  <div class="lane" data-lane="${d.id}" data-act="dropLane" data-id="${d.id}">${recTasks(d.id,dia,pos)}${tripsDia(d.id,dia).map(t=>`<div class="task ${t.st==='pendente'?'pend':''} ${selTask===t.id?'sel':''}" draggable="true" data-task="${t.id}" data-act="pickTask" data-id="${t.id}" style="${pos(t)}" title="${t.dest} ${t.ini}–${t.fim} · ${t.vei?V(t.vei).placa:'sem veículo'}">${t.dest} · ${t.vei?V(t.vei).placa:'—'}${t.st==='pendente'?' · aguardando ciência':''}</div>`).join('')}</div></div>`}).join('')}
 </div></div><p class="muted" style="font-size:.8rem;margin-top:8px">Azul-escuro: confirmada · Azul-claro: aguardando ciência · Listrado: rota recorrente. Limite semanal: ${S.regras.cargaMax} h.</p>`};
AFTER.escala=()=>{document.querySelectorAll('[data-task]').forEach(el=>el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.task)}));
 document.querySelectorAll('[data-lane]').forEach(l=>{l.addEventListener('dragover',e=>{e.preventDefault();l.classList.add('drop')});l.addEventListener('dragleave',()=>l.classList.remove('drop'));l.addEventListener('drop',e=>{e.preventDefault();l.classList.remove('drop');atribuir(e.dataTransfer.getData('text/plain'),l.dataset.lane)})})};
function atribuir(tid,did,forcar){const t=T(tid);if(!t)return;if(t.mot===did){selTask=null;render();return}
 let trip={...t};if(!trip.vei){const s=sugerir(trip);trip.vei=s?s.v.id:null}
 const c=conflitos(did,trip,t.id);const dur_=c.filter(x=>x.g==='r'),avs=c.filter(x=>x.g==='y');
 if(dur_.length){modal('Não é possível designar',`<div class="acard r"><h3>${ic('alert')} ${esc(D(did).nome)}</h3>${dur_.map(x=>`<p>${esc(x.t)}</p>`).join('')}</div><p class="muted" style="margin-top:10px">Escolha outro motorista. ${(()=>{const s=sugerir(trip);return s?`Sugestão do sistema: <b>${esc(s.d.nome)}</b> com ${s.v.placa}.`:''})()}</p>`,`<button class="btn" data-act="closeModal">Entendi</button>`);return}
 if(avs.length&&!forcar){modal('Atenção à carga de trabalho',`<div class="acard y">${avs.map(x=>`<p>${esc(x.t)}</p>`).join('')}</div><label class="f" style="margin-top:12px">Justificativa (fica na auditoria)<textarea class="in" id="just" placeholder="Ex.: único motorista com CNH D disponível"></textarea></label>`,`<button class="btn sec" data-act="closeModal">Cancelar</button><button class="btn" data-act="forcarAtrib" data-t="${tid}" data-d="${did}">Designar mesmo assim</button>`);return}
 const ant=t.mot;t.mot=did;if(!t.vei)t.vei=trip.vei;t.st='pendente';selTask=null;
 notify(did,`Convocação: ${t.dest} (${t.local}) ${DIAS[t.dia]} às ${t.ini} com o veículo ${t.vei?V(t.vei).placa:'a definir'}. Confirme sua ciência.`,'viagem');
 if(ant)notify(ant,`Você foi retirado da viagem a ${t.dest} (${DIAS[t.dia]} ${t.ini}).`,'viagem');
 audit(`Designou ${D(did).nome} para viagem ${t.id} — ${t.dest} ${DIAS[t.dia]} ${t.ini}${forcar?' (acima da carga; justificativa: '+forcar+')':''}`,t.id);closeModal();toast('Viagem designada. Motorista notificado.');render()}

PAGES.plano=u=>{const p=F.plano||{dest:'Curitiba',local:'',fin:'',pax:2,pac:true,dia:1,ini:'06:00',fim:'19:00',mot:'',vei:''};F.plano=p;const ehSec=u.perfil==='secretaria';
 const r=DEST[p.dest];const igual=S.trips.filter(t=>t.dest===p.dest&&t.dia===+p.dia&&t.st!=='recusada'&&p.dest!=='Campo Mourão');
 const tripObj={dia:+p.dia,ini:p.ini,fim:p.fim,pax:+p.pax,pac:p.pac};const sug=!ehSec&&sugerir(tripObj);
 const vsOk=S.vehicles.filter(v=>v.status!=='r');
 return head('Plano de viagem',ehSec?'Informe destino, finalidade e passageiros. O Gestor de Frota designa motorista e veículo.':'Destino, finalidade, passageiros, motorista e veículo. O sistema sugere o melhor par e avisa quando dá para compartilhar.')+
 `<div class="grid split"><form class="card" id="fPlano" novalidate>
 <div class="grid g2"><label class="f">Destino<select class="in" name="dest">${Object.keys(DEST).map(d=>`<option ${p.dest===d?'selected':''}>${d}</option>`).join('')}</select></label>

 <div class="grid g2"><label class="f">Passageiros<input class="in" type="number" min="1" max="40" name="pax" value="${p.pax}"></label><label class="chk" style="margin-top:22px"><input type="checkbox" name="pac" ${p.pac?'checked':''}> Inclui pacientes (prioritário)</label></div>
 <div class="grid g3"><label class="f">Dia<select class="in" name="dia">${DIAS.map((d,i)=>`<option value="${i}" ${+p.dia===i?'selected':''}>${d}</option>`).join('')}</select></label><label class="f">Saída<input class="in" type="time" name="ini" value="${p.ini}"></label><label class="f">Chegada prevista<input class="in" type="time" name="fim" value="${p.fim}"></label></div>
 ${ehSec?'':`<div class="grid g2"><label class="f">Motorista<select class="in" name="mot"><option value="">Selecione</option>${S.drivers.map(d=>{const c=conflitos(d.id,{...tripObj,vei:p.vei||null});const bad=c.some(x=>x.g==='r');return `<option value="${d.id}" ${p.mot===d.id?'selected':''} ${bad?'disabled':''}>${esc(d.nome)}${bad?' — indisponível':''}</option>`}).join('')}</select></label>
 <label class="f">Veículo<span class="h">Só aparecem veículos verdes ou amarelos</span><select class="in" name="vei"><option value="">Selecione</option>${vsOk.map(v=>{const ok=dispVeic(v,+p.dia,p.ini,p.fim);return `<option value="${v.id}" ${p.vei===v.id?'selected':''} ${ok?'':'disabled'}>${v.status==='y'?'🟡':'🟢'} ${v.placa} — ${TIPO[v.tipo]} ${esc(v.modelo)}${ok?'':' (ocupado)'}</option>`}).join('')}</select></label></div>`}
 <div class="card" style="padding:12px;margin-bottom:12px;box-shadow:none"><b style="font-size:.86rem">Outros destinos / paradas</b><div class="row" style="margin:6px 0">${(p.paradas||[]).map((x,i)=>`<span class="pill nodot st-n">${esc(x)} <button type="button" data-act="rmParada" data-i="${i}" aria-label="Remover ${esc(x)}" style="border:0;background:none;cursor:pointer;color:inherit;padding:0 0 0 4px">✕</button></span>`).join('')||'<small class="muted">Nenhuma parada extra</small>'}</div><div class="row" style="flex-wrap:nowrap"><select class="in" id="novaParada" style="margin:0" aria-label="Adicionar parada"><option value="">Adicionar destino…</option>${Object.keys(DEST).filter(x=>x!==p.dest).map(x=>`<option>${x}</option>`).join('')}</select><button type="button" class="btn sec sm" data-act="addParada">${ic('plus','s')} Adicionar</button></div>
 <label class="f" style="margin:10px 0 0">Trajeto<select class="in" name="alt"><option value="">${DEST[p.dest].via} (padrão)</option>${viasDe(p.dest).slice(1).map(x=>`<option ${p.alt===x?'selected':''}>${x}</option>`).join('')}</select></label>${p.alt?`<label class="f" style="margin:10px 0 0">Justificativa da alteração<input class="in" name="just" value="${esc(p.just||'')}" placeholder="Ex.: buscar paciente em Peabiru"></label>`:''}</div>

 ${sug?`<div class="card lbar g"><h3>Sugestão do sistema</h3><p style="margin-top:6px"><b>${esc(sug.d.nome)}</b> com <b class="mono">${sug.v.placa}</b> (${TIPO[sug.v.tipo]}${sug.v.prio?', prioritário':''})</p><small>Motorista habilitado, sem conflito e com menor carga na semana (${horasSemana(sug.d.id).toFixed(1)} h). Veículo livre no horário e com capacidade para ${p.pax} passageiros.</small><br><button class="btn sm sec" style="margin-top:10px" data-act="usarSug" data-d="${sug.d.id}" data-v="${sug.v.id}">Usar sugestão</button></div>`:(!ehSec?'<div class="card lbar r"><b>Sem par disponível</b><p class="muted">Nenhum motorista e veículo livres neste horário. Ajuste o horário ou o dia.</p></div>':'')}

PAGES.viagens=u=>{const ts=S.trips.slice().sort((a,b)=>a.dia-b.dia||toMin(a.ini)-toMin(b.ini));

 return head('Viagens e confirmações','Acompanhe quem confirmou, quem recusou e quem ainda não respondeu à convocação.')+
 `<div class="tbl-wrap"><table><thead><tr><th>Quando</th><th>Destino</th><th>Finalidade</th><th>Motorista</th><th>Veículo</th><th>Situação</th><th></th></tr></thead><tbody>${ts.map(t=>{const l=lbl[t.st];return `<tr><td class="mono">${DIAS[t.dia]}<br>${t.ini}–${t.fim}</td><td><b>${t.dest}</b><br><small>${esc(t.local)}</small>${(t.paradas||[]).length?'<br><small>Paradas: '+t.paradas.map(esc).join(', ')+'</small>':''}${t.viaAlt?'<br><small style="color:var(--o);font-weight:700">Trajeto alterado: '+esc(t.viaAlt)+'</small>':''}</td><td>${esc(t.fin)}<br><small>${t.pax} ${t.pac?'pacientes':'passageiros'}${t.compart?' · compartilhada':''}</small></td><td>${t.mot?esc(D(t.mot).nome):'—'}${t.motivo?`<br><small style="color:var(--r)">Motivo: ${esc(t.motivo)}</small>`:''}</td><td class="mono">${t.vei?V(t.vei).placa:'—'}</td><td><span class="pill st-${l[1]}">${l[0]}</span></td>
 <td>${u.perfil==='gestor'&&['pendente','aceita','andamento'].includes(t.st)?`<button class="btn sm ghost" data-act="altTraj" data-id="${t.id}">Alterar trajeto</button>`:''}${u.perfil==='gestor'?(t.st==='pendente'?`<button class="btn sm sec" data-act="lembrar" data-id="${t.id}">Reenviar lembrete</button>`:(t.st==='solicitada'||t.st==='recusada')?`<button class="btn sm" data-act="resolverViagem" data-id="${t.id}">Designar</button>`:''):''}</td></tr>`}).join('')}</tbody></table></div>`};

PAGES.agenda=u=>{const did=u.ref;const pend=S.trips.filter(t=>t.mot===did&&t.st==='pendente');const minhas=S.trips.filter(t=>t.mot===did&&t.st!=='recusada');const hoje=minhas.filter(t=>t.dia===0);const semana=minhas.filter(t=>t.dia>0);

 return head('Olá, '+esc(u.nome.split(' ')[0]),'Sua agenda de hoje e da semana.')+
 pend.map(t=>`<div class="conv" style="margin-bottom:12px"><div class="row" style="gap:8px;font-weight:700;font-size:.85rem;opacity:.9">${ic('bell','s')} Convocação</div><div class="big">Você deve ir para ${esc(t.local)} (${t.dest}) ${t.dia===0?'hoje':DIAS[t.dia].toLowerCase()} às ${t.ini}, com o veículo <span class="mono">${V(t.vei).placa}</span>.</div><p style="opacity:.9;font-size:.88rem;margin-bottom:12px">${esc(t.fin)} · ${t.pax} ${t.pac?'pacientes':'passageiros'} · lembretes ${S.regras.lembretes.split(',').map(x=>x>=60?x/60+' h':x+' min').join(' e ')} antes</p><div class="grid g2"><button class="btn" data-act="aceitar" data-id="${t.id}">${ic('check')} Ciente / Aceitar</button><button class="btn sec" data-act="recusar" data-id="${t.id}">Não posso</button></div></div>`).join('')+
 `<h2 style="margin:6px 0 10px">Hoje</h2><div class="stack">${hoje.length?hoje.map(card).join(''):'<div class="card empty">Nenhuma viagem hoje.</div>'}</div>

PAGES.emviagem=u=>{const did=u.ref;const t=S.trips.find(t=>t.mot===did&&t.st==='andamento')||S.trips.find(t=>t.mot===did&&t.dia===0&&t.st==='aceita');

PAGES.relatar=u=>{const did=u.ref;const t=S.trips.find(t=>t.mot===did&&t.st==='andamento');const r=F.rel||{vei:t?t.vei:'v1',tipo:'Pane mecânica',grav:'leve',desc:'',foto:null,passo:1,of:null};F.rel=r;const v=V(r.vei);

 if(r.passo===2)return head('Escolha a oficina','Oficinas autorizadas mais próximas que atendem '+TIPO[v.tipo].toLowerCase()+' e '+alvo.toLowerCase()+'. Só oficinas da lista oficial podem ser escolhidas.')+
 `<div class="stack">${ofs.map(w=>`<label class="card row" style="cursor:pointer;align-items:flex-start;${r.of===w.id?'border:2px solid var(--p)':''}"><input type="radio" name="of" value="${w.id}" data-act="pickOf" data-id="${w.id}" ${r.of===w.id?'checked':''} style="width:22px;height:22px;accent-color:var(--p);margin-top:2px"><div style="flex:1"><div class="row between"><b>${esc(w.nome)}</b><span class="mono">${w.dist.toFixed(1)} km</span></div><small>${w.servicos.join(', ')}</small><br><small class="muted">${esc(w.end)} · ${esc(w.regras)}</small></div></label>`).join('')||'<div class="card empty">Nenhuma oficina autorizada atende este caso. O Gestor foi avisado.</div>'}</div>
 <div class="row" style="margin-top:14px"><button class="btn sec" data-act="relVoltar">Voltar</button><button class="btn" style="flex:1" data-act="solicitarAtend" ${r.of?'':'disabled'}>Solicitar atendimento</button></div>`;
 return head('Relatar problema','Registre a ocorrência em poucos toques. Localização, data e hora são gravadas automaticamente. O registro do conserto fica com o gestor ou a PRIME.')+
 `<div class="card"><label class="f">Veículo<select class="in" data-act-change="fRel" data-k="vei">${S.vehicles.map(x=>`<option value="${x.id}" ${r.vei===x.id?'selected':''}>${x.placa} — ${esc(x.modelo)}</option>`).join('')}</select></label>
 <fieldset style="border:0;padding:0;margin:0 0 12px"><legend style="font-weight:600;font-size:.86rem;margin-bottom:6px">O que aconteceu?</legend><div class="chips" style="flex-wrap:wrap">${Object.keys(servMap).concat(['Outro']).map(k=>`<button class="chip ${r.tipo===k?'on':''}" data-act="relTipo" data-t="${k}">${k}</button>`).join('')}</div></fieldset>
 <fieldset style="border:0;padding:0;margin:0 0 12px"><legend style="font-weight:600;font-size:.86rem;margin-bottom:6px">Dá para continuar rodando?</legend><div class="grid g2"><button class="btn ${r.grav==='leve'?'':'sec'}" data-act="relGrav" data-g="leve">Sim, com cuidado</button><button class="btn ${r.grav==='grave'?'danger':'sec'}" data-act="relGrav" data-g="grave">Não, veículo parado</button></div></fieldset>
 <label class="f">Foto (inclusive de acidente)<input class="in" type="file" accept="image/*" capture="environment" id="relFoto"></label>
 <div id="relPrev">${r.foto?`<img src="${r.foto}" alt="Foto anexada" style="max-width:100%;max-height:180px;border-radius:10px">`:''}</div>

 <div class="notice">${ic('pin')}<div><b>Localização automática</b><br><span class="mono">-24.0466, -52.3780</span> · BR-487, km 12 — Campo Mourão · ${AGORA.txt}</div></div>
 ${r.grav==='grave'?`<div class="acard r" style="margin-top:10px"><b>O veículo ficará vermelho e bloqueado.</b> As viagens dele serão remanejadas para outro veículo e o Gestor será avisado.</div>`:''}
 <button class="btn block" style="margin-top:14px" data-act="relProx">Continuar: escolher oficina</button></div>`};
AFTER.relatar=()=>{const f=$('#relFoto');if(f)f.addEventListener('change',()=>{const file=f.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{F.rel.foto=rd.result.length<900000?rd.result:null;$('#relPrev').innerHTML=`<img src="${rd.result}" alt="Foto anexada" style="max-width:100%;max-height:180px;border-radius:10px">`};rd.readAsDataURL(file)})};

 `<div class="grid g2">${S.workshops.slice().sort((a,b)=>a.prio-b.prio).map(w=>`<div class="card"><div class="row between"><h2>${esc(w.nome)}</h2><span class="pill nodot ${w.prio===1?'st-g':w.prio===2?'st-n':'st-y'}">Prioridade ${w.prio}</span></div><p class="muted">${esc(w.end)}</p><p><b>Serviços:</b> ${w.servicos.join(', ')}</p><p><b>Veículos:</b> ${w.tipos.map(t=>TIPO[t]).join(', ')}</p><p><b>Regras:</b> ${esc(w.regras)}</p><p><b>Contrato:</b> ${w.licit||'—'}</p></div>`).join('')}</div>`;

 `<form class="card" id="fRegras"><div class="grid g3">

 ${ed?'<button class="btn" style="margin-top:12px" type="submit">Salvar regras</button>':''}</form>`};

PAGES.orcamento=u=>{const tot=Object.values(S.orcamento).reduce((a,b)=>a+b,0);const g=S.gastos.reduce((a,x)=>a+x.v,0);const prev=S.gastos.filter(x=>x.tipo==='preventiva').reduce((a,x)=>a+x.v,0);const comp=S.os.filter(o=>o.etapa>=2&&o.etapa<6).reduce((a,o)=>a+osTotal(o),0);
 const secs={};S.vehicles.forEach(v=>{secs[v.sec]=secs[v.sec]||{orc:0,g:0};secs[v.sec].orc+=S.orcamento[v.id]||0;secs[v.sec].g+=gastoVei(v.id)});

 `<div class="grid g4" style="margin-bottom:12px"><div class="card kpi"><b>${brl(tot)}</b><span>Orçamento total da frota</span></div><div class="card kpi lbar g"><b>${brl(tot-g-comp)}</b><span>Saldo disponível</span></div><div class="card kpi"><b>${brl(prev)}</b><span>Gasto em manutenção preventiva</span></div><div class="card kpi"><b>${brl(g-prev)}</b><span>Gasto em conserto (corretiva)</span></div></div>

 if(F.orcFor)return orcForm(S.os.find(o=>o.id===F.orcFor),u);
 return head('Solicitações recebidas','Pedidos de orçamento enviados pela Prefeitura para a sua oficina.')+
 `<div class="stack">${pend.map(o=>{const v=V(o.vei);return `<div class="card lbar y"><div class="row between"><b>${o.id}</b><span class="pill st-y">Aguardando seu orçamento</span></div><p>${esc(o.desc)}</p><small><span class="mono">${v.placa}</span> · ${esc(v.modelo)} · ${num(v.km)} km · aberta em ${o.abertura}</small><br><button class="btn sm" style="margin-top:10px" data-act="orcFor" data-id="${o.id}">Enviar orçamento</button></div>`}).join('')||'<div class="card empty">Nenhuma solicitação pendente.</div>'}</div>
 <h2 style="margin:20px 0 10px">Orçamentos enviados</h2><div class="stack">${env.map(o=>{const q=o.orc.find(q=>q.of===u.ref);return `<div class="card"><b>${o.id}</b> · ${brl(qTotal(q))} · ${o.escolhido===u.ref?'<span class="pill st-g">Escolhido</span>':o.escolhido?'<span class="pill st-r">Não escolhido</span>':'<span class="pill st-y">Em análise</span>'}</div>`}).join('')||'<div class="card empty">Nenhum orçamento enviado.</div>'}</div>`};

 return head('Orçamento para '+o.id,esc(o.desc)+' · '+v.placa+' '+esc(v.modelo))+

function go(r){if(location.hash==='#/'+r)render();else location.hash='#/'+r}
function remanejar(vid,dias){const out=[];S.trips.filter(t=>t.vei===vid&&dias.includes(t.dia)&&['pendente','aceita','solicitada'].includes(t.st)).forEach(t=>{const v0=V(vid);const cand=S.vehicles.filter(v=>v.id!==vid&&v.status!=='r'&&(v.tipo===v0.tipo||(v0.tipo==='van'&&v.tipo==='onibus')||(v0.tipo==='carro'&&v.tipo!=='carro'))&&dispVeic(v,t.dia,t.ini,t.fim)&&(!t.mot||(D(t.mot).tipos.includes(v.tipo)&&CNH_OK[v.tipo].includes(D(t.mot).cnh))));const n=cand[0];if(n){t.vei=n.id;if(t.mot)notify(t.mot,`Mudança de veículo: ${t.dest} ${DIAS[t.dia]} ${t.ini} agora com ${n.placa} (o ${v0.placa} saiu da escala).`,'viagem');out.push(`${t.dest} ${DIAS[t.dia]} ${t.ini}: ${v0.placa} → ${n.placa}`)}else{out.push(`${t.dest} ${DIAS[t.dia]} ${t.ini}: sem veículo livre — Gestor avisado`);notify('gestor',`Sem veículo substituto para ${t.dest} ${DIAS[t.dia]} ${t.ini}.`,'viagem')}});return out}
function verificarCadeia(){let prev='0'.repeat(24);for(const e of S.audit){const h=fnv(prev+JSON.stringify([e.n,e.q,e.quem,e.perfil,e.acao,e.alvo]));if(e.prev!==prev||e.hash!==h)return e.n;prev=e.hash}return 0}
function login(cpf,senha){const c=cpf.replace(/\D/g,'');const e=$('#lerr');if(!cpfValido(c)){e.textContent='CPF inválido. Confira os 11 números.';$('#lcpf').classList.add('err');return}
 const u=S.users.find(x=>x.cpf===c);if(!u||u.senha!==senha){e.textContent='CPF ou senha incorretos.';return}
 if(u.status==='pendente'){e.textContent='Seu cadastro aguarda aprovação do Administrador. Você será avisado quando o acesso for liberado.';return}
 if(!MENU[u.perfil]){e.textContent='Este tipo de acesso foi desativado. Procure o Administrador.';return}S.sess=c;F={q:{}};selTask=null;$('#toast').classList.remove('show');audit('Entrou no sistema','login');save();location.hash='#/'+HOME[u.perfil];render()}

/* ========== VEÍCULOS com filtros (placa, tipo, status) ========== */
